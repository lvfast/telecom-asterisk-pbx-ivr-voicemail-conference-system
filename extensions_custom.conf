[from-internal-custom]
; 1. Goi ra ngoai co tien to 8 (VD: 81001 -> quay so 1001)
exten => _8.,1,NoOp(--- CUOC GOI RA NGOAI TIEN TO 8 ---)
exten => _8.,n,Dial(SIP/${EXTEN:1},30)
exten => _8.,n,Hangup()

; 2. Phong hop MeetMe 9489
exten => 9489,1,NoOp(--- PHONG HOP HOI NGHI 9489 ---)
exten => 9489,n,Answer()
exten => 9489,n,MeetMe(9489,iM)
exten => 9489,n,Hangup()

; 3. Dang nhap hop thu thoai 6999
exten => 6999,1,NoOp(--- DANG NHAP VOICEMAIL 6999 ---)
exten => 6999,n,Answer()
exten => 6999,n,VoiceMailMain()
exten => 6999,n,Hangup()

; 4. May nhanh Giam doc 6000 (Do chuong 15s chuyen Voicemail)
exten => 6000,1,NoOp(--- GOI GIAM DOC 6000 ---)
exten => 6000,n,Dial(SIP/6000,15)
exten => 6000,n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
exten => 6000,n(unavail),VoiceMail(6000@default,u)
exten => 6000,n,Hangup()
exten => 6000,n(busy),VoiceMail(6000@default,b)
exten => 6000,n,Hangup()

; 5. Dau so IVR 7000 (Dinh tuyen theo gio)
exten => 7000,1,NoOp(--- TONG DAI IVR 7000 ---)
exten => 7000,n,Answer()
exten => 7000,n,GotoIfTime(07:00-10:59,*,*,*?open-hours,s,1)
exten => 7000,n,GotoIfTime(13:00-16:59,*,*,*?open-hours,s,1)
exten => 7000,n,Goto(closed-hours,s,1)

; --- Context trong gio lam viec ---
[open-hours]
exten => s,1,Playback(Welcome_48)
exten => s,n,Set(LOOPCOUNT=0)
exten => s,n(menu_loop),Set(LOOPCOUNT=$[${LOOPCOUNT} + 1])
exten => s,n,GotoIf($[${LOOPCOUNT} > 3]?goodbye,1)
exten => s,n,Background(Menu_48)
exten => s,n,WaitExten(5)

; Nhanh 1: Tai vu (6001)
exten => 1,1,Playback(Connecting_taivu)
exten => 1,n,Dial(SIP/6001,20)
exten => 1,n,Hangup()

; Nhanh 2: Nhan su (6002)
exten => 2,1,Playback(Connecting_nhansu)
exten => 2,n,Dial(SIP/6002,20)
exten => 2,n,Hangup()

; Nhanh 3: Kinh doanh (6003)
exten => 3,1,Playback(Connecting_kinhdoanh)
exten => 3,n,Dial(SIP/6003,20)
exten => 3,n,Hangup()

; Bam truc tiep so noi bo 4 chu so
exten => _6XXX,1,Dial(SIP/${EXTEN},20)
exten => _6XXX,n,Hangup()

; Bam sai phim
exten => i,1,Playback(Invalid_48)
exten => i,n,Goto(s,menu_loop)

; Timeout (cho phep lap toi da 3 lan)
exten => t,1,Goto(s,menu_loop)

; Qua 3 lan
exten => goodbye,1,Playback(Goodbye_48)
exten => goodbye,n,Hangup()

; --- Context ngoai gio lam viec ---
[closed-hours]
exten => s,1,Playback(Closed_48)
exten => s,n,Hangup()
